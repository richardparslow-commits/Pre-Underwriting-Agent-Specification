# Life Policy Pilot — Supabase project configuration
#
# These settings are part of the deployable repository so a clean deployment
# does not silently leave the public endpoint behind JWT verification or expose
# a reviewer-only function to anonymous callers.
#
# submit-case and revoke-marketing are the customer-facing functions. Both are
# public by design and are protected by origin allowlisting, a byte cap,
# durable rate limiting and server-side validation. email-events,
# retry-case-notifications and sync-marketing-suppressions are machine-facing
# and authenticate with a provider signature or cron secret.

project_id = "lifepolicypilot"

# Reviewer accounts are created by an operator, never by the sign-in form.
# `sendSignInLink` also passes shouldCreateUser: false; this block keeps a
# local or linked project from accepting self-service sign-ups underneath it.
# The hosted project must have the same setting under Authentication → Sign In /
# Providers → "Allow new users to sign up" = off.
[auth]
enable_signup = false
enable_anonymous_sign_ins = false

# The reviewer portal enrols and challenges a TOTP factor in-app. The local
# defaults for these two switches are false, so leaving them unset would make a
# project started from this file reject the portal's MFA calls even though the
# UI offers them. Hosted projects must also have TOTP enabled under
# Authentication -> Providers -> Multi-Factor Authentication.
[auth.mfa]
max_enrolled_factors = 1

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.submit-case]
verify_jwt = false

[functions.revoke-marketing]
verify_jwt = false

[functions.email-events]
verify_jwt = false

[functions.sync-marketing-suppressions]
verify_jwt = false

[functions.retry-case-notifications]
verify_jwt = false

# No other function should be deployed with JWT verification disabled.
