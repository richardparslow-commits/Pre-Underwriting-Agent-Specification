name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    name: Bank check, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        # v4.3.1 — pinned to a commit, not a movable tag.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        # v4.4.0 — pinned to a commit, not a movable tag.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      # Install without lifecycle scripts: no dependency in this tree needs a
      # postinstall to build, so an unreviewed install hook cannot execute in CI.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Set up Deno
        # v2.0.5 — pinned to a commit, not a movable tag.
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.6

      # The public intake is the security boundary: a draft that omits either
      # required consent must be rejected before a case is written, even when
      # the browser form is bypassed. This drives the real submit-case handler.
      - name: Server regression tests
        run: deno test --allow-env --lock=deno.lock supabase/functions/tests/

      # Consent evidence is generated from build-time channel flags. A
      # placeholder seller or a disabled channel must never produce a
      # marketing record the customer could not have seen.
      - name: Marketing consent regression test
        run: npm run test:consent

      - name: Interview engine regression test
        run: npm run test:engine

      - name: Reviewer visibility database and UI regressions
        run: |
          npm run check:reviewer-visibility
          npm run test:reviewer-visibility

      # The lead form repeats the server's contact rules. A phone preference
      # without a usable number must fail before the interview starts.
      - name: Lead validation regression test
        run: npm run test:validation

      - name: Submission UI regression test
        run: npm run test:submission-ui

      # Isolated PostgreSQL replay: reviewer writes must stay RPC-only and a
      # delivery event that arrives before its case must remain retryable.
      - name: Database regression test
        run: npm run check:db

      # Fails if a bank row loses its reconciliation record, a source question
      # stops being acknowledged, or the crisis question is gated again.
      - name: Question bank reconciliation
        run: npm run check:bank

      # The server must use exactly the same bank and consent wording as the
      # browser. Drift here would make a valid customer submission fail closed
      # or, worse, let an old row through.
      - name: Server bank and consent policy are current
        run: |
          npm run check:server-bank
          npm run check:server-policy

      # Reviewer access must stay in-app: TOTP enrolment and challenge, no
      # self-service sign-up, and a cursor-paginated queue with an exact count.
      - name: Reviewer access guard
        run: npm run check:portal

      # Marketing must fail closed: every state has a zone, the licensed list
      # defaults to empty, and the sender checks policy and suppression before
      # it can call a provider.
      - name: Marketing control guard
        run: npm run check:marketing

      # Counts and claims in customer/reviewer docs must match the audited data.
      - name: Documentation counts are current
        run: npm run check:docs

      # The review document is generated, so a bank change that was not followed
      # by `npm run report:reconciliation` would leave reviewers reading stale
      # decisions. Fail on any diff rather than letting the document drift.
      - name: Reconciliation report is current
        run: |
          npm run report:reconciliation
          if ! git diff --quiet -- docs/question-bank-reconciliation.md; then
            echo "::error::docs/question-bank-reconciliation.md is out of date. Run `npm run report:reconciliation` and commit the result."
            git diff --stat -- docs/question-bank-reconciliation.md
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      # Verbatim source wording belongs in the build/audit inventory, not in
      # the public JavaScript. This is the bundle-level M-11 regression guard.
      - name: No source wording in the public bundle
        run: npm run check:bundle

      # Enforcement is a branch decision, not a check decision: a push to a
      # protected branch must go red until the gate closes, while a pull request
      # reports a warning so everyday work is not blocked on a signature only
      # the owner can provide. Add a branch to the pattern list to protect it.
      - name: Scope the SC-01 gate to protected branches
        run: |
          enforce=0
          case "${GITHUB_EVENT_NAME}:${GITHUB_REF_NAME}" in
            push:main|push:release) enforce=1 ;;
          esac
          echo "SC01_ENFORCE=${enforce}" >> "$GITHUB_ENV"

      # Deliberately last: a failing step aborts the job, so placing this
      # earlier would hide typecheck, build and every other check while the
      # gate is open.
      #
      # Enforced on a push to a protected branch (see the step above): red there
      # means the gate is closed, not merely self-consistent. On a pull request
      # an open gate is a warning. A resolution recorded before the owner
      # attested, or a completed attestation the registers never picked up,
      # fails on every branch. Fix by completing the attestation and updating
      # the registers, never by deleting the step.
      - name: SC-01 closure gate is closed and consistent
        run: npm run check:sc01
