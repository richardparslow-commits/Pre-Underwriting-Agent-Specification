name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    name: Bank check, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails if a bank row loses its reconciliation record, a source question
      # stops being acknowledged, or the crisis question is gated again.
      - name: Question bank reconciliation
        run: npm run check:bank

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
