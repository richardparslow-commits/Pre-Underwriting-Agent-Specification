name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    name: Bank check, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails if a bank row loses its reconciliation record, a source question
      # stops being acknowledged, or the crisis question is gated again.
      - name: Question bank reconciliation
        run: npm run check:bank

      # The review document is generated, so a bank change that was not followed
      # by `npm run report:reconciliation` would leave reviewers reading stale
      # decisions. Fail on any diff rather than letting the document drift.
      - name: Reconciliation report is current
        run: |
          npm run report:reconciliation
          if ! git diff --quiet -- docs/question-bank-reconciliation.md; then
            echo "::error::docs/question-bank-reconciliation.md is out of date. Run `npm run report:reconciliation` and commit the result."
            git diff --stat -- docs/question-bank-reconciliation.md
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
